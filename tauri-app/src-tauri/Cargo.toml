[package]
name = "medict-tauri"
version = "0.1.0"
description = "Medict Tauri 2 migration workspace"
authors = ["Medict"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
medict-core = { path = "../../crates/medict-core" }
tauri = { version = "2", features = ["tray-icon"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
