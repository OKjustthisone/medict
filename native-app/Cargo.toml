[package]
name = "medict-native"
version = "0.1.0"
description = "Medict native Windows client using Rust, Win32 and Direct2D"
authors = ["Medict"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[dependencies]
medict-core = { path = "../crates/medict-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
windows = { version = "0.61.3", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
windows-numerics = "0.2.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
